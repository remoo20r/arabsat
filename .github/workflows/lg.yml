name: Build Arabesk TV LG app

on:
  push:
    branches: [main]
    paths: ['lg/**', '.github/workflows/lg.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build the LG webOS app (.ipk)
        run: |
          npm install -g @webos-tools/cli
          mkdir -p out
          ares-package lg/app -o out
          cp out/*.ipk ArabeskTV-LG.ipk
      - uses: actions/upload-artifact@v4
        with:
          name: ArabeskTV-LG-ipk
          path: ArabeskTV-LG.ipk
      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lg-latest
          name: Arabesk TV for LG TVs (latest)
          body: "Arabesk TV for LG smart TVs (webOS). Build ${{ github.run_number }}."
          files: ArabeskTV-LG.ipk
          make_latest: false
