name: Build Arabesk TV Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the APK
        working-directory: android
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          chmod +x gradlew
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"; export KS_FILE="$RUNNER_TEMP/release.keystore"; echo "SIGNED=1" >> $GITHUB_ENV; fi
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../ArabeskTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ArabeskTV-apk
          path: ArabeskTV.apk
      - name: Publish as the latest release
        if: env.SIGNED == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Arabesk TV for Android (latest)
          body: "Arabesk TV for Android phones, tablets, Android TV and Fire TV. Build ${{ github.run_number }}."
          files: ArabeskTV.apk
          make_latest: true
      - name: Put the APK on the Arabesk TV server (served at /apk)
        if: env.SIGNED == '1'
        run: |
          cp ArabeskTV.apk public/ArabeskTV.apk
          git config user.name "Arabesk TV build"
          git config user.email "actions@users.noreply.github.com"
          git add public/ArabeskTV.apk
          git commit -m "Android app build ${{ github.run_number }} [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
