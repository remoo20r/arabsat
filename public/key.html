<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arabesk TV - Activation key</title>
<link rel="stylesheet" href="style.css?v=3">
<link rel="apple-touch-icon" href="icon-180.png">
</head>
<body>
<div class="login"><div class="card">
  <div class="big"><img src="icon-512.png" alt=""><div class="w">ARABESK <b>TV</b></div><div class="ar">أرابيسك تي في</div></div>
  <div id="box"><div class="loading"><div class="spin"></div></div></div>
  <div class="err" id="er"></div>
</div></div>
<script>
(function () {
'use strict';
const $ = (q) => document.querySelector(q);
const sid = new URLSearchParams(location.search).get('s') || '';
const box = $('#box'), er = $('#er');
const b64u = (buf) => btoa(String.fromCharCode.apply(null, new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0));
async function post(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ s: sid }, body)) });
  return r.json();
}
async function options() {
  const r = await fetch('/api/pk/options?s=' + encodeURIComponent(sid));
  if (!r.ok) throw new Error('expired');
  return r.json();
}
function done(code, restored) {
  box.innerHTML = `<div class="codebox"><div style="font-size:54px">✅</div>
    <div class="lbl">${restored ? 'Your code is back' : 'Your activation code'}</div><div class="code">${String(code).replace(/^(\d{3})(\d{3})$/, '$1 $2')}</div>
    <div class="hint"><b>Go back to the Arabesk TV app.</b> You can close this page.</div>
    <div class="hint" dir="rtl"><b>ارجع لتطبيق Arabesk TV</b>، وتقدر تقفل الصفحة دي.</div></div>`;
  setTimeout(() => { try { window.close(); } catch (e) {} }, 1500);
}
function fail(msg) { er.textContent = msg; }
const supported = !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create);

async function createKey() {
  er.textContent = '';
  try {
    const o = await options();
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: unb64u(o.challenge), rp: { id: o.rp, name: 'Arabesk TV' },
      user: { id: unb64u(o.uid), name: 'Arabesk TV', displayName: 'Arabesk TV' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { residentKey: 'required', requireResidentKey: true, userVerification: 'required' },
      attestation: 'none', timeout: 120000 } });
    const resp = cred.response;
    if (!resp.getPublicKey) { fail('This phone is too old for Face ID keys. Update iOS and try again.'); return; }
    const j = await post('/api/pk/create', { id: cred.id, pub: b64u(resp.getPublicKey()), alg: resp.getPublicKeyAlgorithm(),
      clientDataJSON: b64u(resp.clientDataJSON) });
    if (j.ok) done(j.code, false); else fail(j.error === 'expired' ? 'This page expired. Go back to the app and tap the button again.' : 'Something went wrong, try again.');
  } catch (e) { if (e.message === 'expired') fail('This page expired. Go back to the app and tap the button again.'); else fail('Not completed. Tap the button and confirm with Face ID or your passcode.'); }
}
async function restoreKey() {
  er.textContent = '';
  try {
    const o = await options();
    const cred = await navigator.credentials.get({ publicKey: { challenge: unb64u(o.challenge), rpId: o.rp, userVerification: 'required', timeout: 120000 } });
    const r = cred.response;
    const j = await post('/api/pk/get', { id: cred.id, clientDataJSON: b64u(r.clientDataJSON), authenticatorData: b64u(r.authenticatorData), signature: b64u(r.signature) });
    if (j.ok) done(j.code, true);
    else if (j.error === 'nokey') fail('No old Arabesk TV key found. Use the first button to get a new code.');
    else fail('Something went wrong, try again.');
  } catch (e) { fail('No old Arabesk TV key found on this phone. Use the first button to get a new code.'); }
}
async function noKey() {
  const j = await post('/api/pk/none', {});
  if (j.ok) done(j.code, false); else fail('This page expired. Go back to the app and tap the button again.');
}

if (!sid) { box.innerHTML = '<div class="empty">Open this page from the Arabesk TV app.</div>'; return; }
if (!supported) { box.innerHTML = '<div class="loading"><div class="spin"></div></div>'; noKey(); return; }
box.innerHTML = `<div class="codebox">
  <div class="hint" style="font-size:15px;color:var(--text)">Confirm with <b>Face ID</b> or your <b>phone passcode</b> to get your activation code. Your code stays the same even if you delete the app or change your phone.</div>
  <div class="hint" dir="rtl" style="font-size:15px">أكّد ببصمة الوش أو الرقم السري بتاع الموبايل علشان تاخد كود التفعيل. الكود هيفضل ثابت حتى لو مسحت التطبيق أو غيّرت الموبايل.</div>
  <button class="btn red" id="cr" style="margin-top:16px">Get my code · خد الكود</button>
  <button class="btn ghost" id="rs" style="margin-top:10px;font-size:15px">I had Arabesk TV before · كان عندي قبل كده</button></div>`;
$('#cr').onclick = createKey;
$('#rs').onclick = restoreKey;
})();
</script>
</body>
</html>
